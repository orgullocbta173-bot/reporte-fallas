<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Fallas de Internet - Bachillerato</title>
    <!-- Framework de diseño directo -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Estilos de compatibilidad local asegurada */
        .input-field {
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2) !important;
        }
        .file-upload-container {
            transition: border-color 0.2s ease;
        }
        .file-upload-container:hover {
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Módulo de Reportes de Internet</h1>
            <p class="text-slate-500 text-sm mt-1">Bachillerato Tecnológico - Formulario de Incidencias</p>
        </div>

        <form id="failureReportForm" class="space-y-6">
            
            <!-- SECCIÓN 1: DATOS DEL USUARIO Y LUGAR -->
            <div class="border-b border-slate-200 pb-5">
                <h2 class="text-base font-semibold text-slate-700 mb-3 flex items-center gap-2">👤 1. Información General</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Nombre Completo</label>
                        <input type="text" id="userName" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Rol en el Plantel</label>
                        <select id="userRole" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                            <option value="">Selecciona tu rol</option>
                            <option value="Alumno">Alumno (400)</option>
                            <option value="Docente">Docente (22)</option>
                            <option value="Intendente">Intendente (6)</option>
                            <option value="Directivo">Directivo (Director/Subdirector)</option>
                            <option value="Jefe de Departamento">Jefe de Departamento</option>
                            <option value="Secretaria">Secretaria</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Lugar / Edificio Escolar</label>
                    <input type="text" id="schoolBuilding" required placeholder="Ej: Edificio A - Aula 4, Laboratorio de Cómputo" class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                </div>
            </div>

            <!-- SECCIÓN 2: DATOS DEL DISPOSITIVO -->
            <div class="border-b border-slate-200 pb-5">
                <h2 class="text-base font-semibold text-slate-700 mb-3 flex items-center gap-2">💻 2. Dispositivo con el que ocurrió la falla</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Tipo de Dispositivo</label>
                        <select id="deviceType" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                            <option value="Celular">Celular</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Tablet">Tablet</option>
                            <option value="PC de Escritorio">PC de Escritorio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Marca</label>
                        <input type="text" id="deviceBrand" placeholder="Ej. Samsung, Apple, HP" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Modelo</label>
                        <input type="text" id="deviceModel" placeholder="Ej. Galaxy A54, ThinkPad E14" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Sistema Operativo</label>
                        <input type="text" id="deviceOS" placeholder="Ej. Android 14, Windows 11" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: DIAGNÓSTICO DE LA FALLA -->
            <div class="border-b border-slate-200 pb-5 space-y-4">
                <h2 class="text-base font-semibold text-slate-700 mb-1 flex items-center gap-2">⚠️ 3. Diagnóstico de la Red</h2>
                
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider mb-2">¿Cuál es el problema principal? (Selecciona uno)</label>
                    <div class="space-y-2 text-sm text-slate-700">
                        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="mainProblem" value="Lentitud" required class="mt-1">
                            <span><strong>Lentitud:</strong> El internet funciona, pero las páginas tardan mucho en cargar.</span>
                        </label>
                        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="mainProblem" value="Intermitencia" class="mt-1">
                            <span><strong>Intermitencia:</strong> El internet va y viene (se desconecta solo).</span>
                        </label>
                        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="mainProblem" value="Corte total" class="mt-1">
                            <span><strong>Corte total:</strong> No tengo acceso a internet en absoluto.</span>
                        </label>
                        <label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="mainProblem" value="Problema con página específica" class="mt-1">
                            <span><strong>Problema con página específica:</strong> El internet funciona bien, pero una página/plataforma no abre.</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider mb-2">¿A quién más le pasa?</label>
                    <div class="space-y-2 text-sm text-slate-700">
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="scope" value="Solo a mí" required class="w-4 h-4">
                            <span>Solo a mí. Mis compañeros de al lado trabajan sin problemas.</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="scope" value="A varios en la misma aula" class="w-4 h-4">
                            <span>A varios compañeros en la misma aula.</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="scope" value="A todo el grupo completo" class="w-4 h-4">
                            <span>A todo el grupo / salón completo.</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 4: DETALLES EXTRA Y CAPTURA -->
            <div class="space-y-4">
                <h2 class="text-base font-semibold text-slate-700 mb-1 flex items-center gap-2">📝 4. Detalles de la falla</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">¿Qué página o plataforma intentas usar?</label>
                    <input type="text" id="targetPlatform" placeholder="Ej: Google Classroom, YouTube" required class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider">Si aparece un mensaje de error en la pantalla, escríbelo aquí:</label>
                    <input type="text" id="errorMessage" placeholder="Ej: 'Error de DNS', 'Tiempo de espera agotado'" class="input-field mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                
                <div>
