<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Fallas de Internet - Bachillerato</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-200 my-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Módulo de Reportes de Internet</h1>
            <p class="text-slate-500 text-sm mt-1">Bachillerato Tecnológico - Formulario de Incidencias</p>
        </div>

        <form id="failureReportForm" class="space-y-6">
            <!-- 1. INFORMACIÓN GENERAL -->
            <div class="border-b border-slate-200 pb-5">
                <h2 class="text-base font-semibold text-slate-700 mb-3">👤 1. Información General</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Nombre Completo</label>
                        <input type="text" id="userName" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Rol en el Plantel</label>
                        <select id="userRole" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                            <option value="">Selecciona tu rol</option>
                            <option value="Alumno">Alumno (400)</option>
                            <option value="Docente">Docente (22)</option>
                            <option value="Intendente">Intendente (6)</option>
                            <option value="Directivo">Directivo</option>
                            <option value="Jefe de Departamento">Jefe de Departamento</option>
                            <option value="Secretaria">Secretaria</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-xs font-medium text-slate-600 uppercase">Lugar / Edificio Escolar</label>
                    <input type="text" id="schoolBuilding" required placeholder="Ej: Edificio A - Aula 4" class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                </div>
            </div>

            <!-- 2. DISPOSITIVO -->
            <div class="border-b border-slate-200 pb-5">
                <h2 class="text-base font-semibold text-slate-700 mb-3">💻 2. Dispositivo con el que ocurrió la falla</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Tipo</label>
                        <select id="deviceType" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                            <option value="Celular">Celular</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Tablet">Tablet</option>
                            <option value="PC de Escritorio">PC de Escritorio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Marca</label>
                        <input type="text" id="deviceBrand" placeholder="Ej. Samsung" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Modelo</label>
                        <input type="text" id="deviceModel" placeholder="Ej. Galaxy A54" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 uppercase">Sistema Operativo</label>
                        <input type="text" id="deviceOS" placeholder="Ej. Android 14" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                    </div>
                </div>
            </div>

            <!-- 3. DIAGNÓSTICO -->
            <div class="border-b border-slate-200 pb-5 space-y-4">
                <h2 class="text-base font-semibold text-slate-700 mb-1">⚠️ 3. Diagnóstico de la Red</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-2">¿Cuál es el problema principal?</label>
                    <div class="space-y-2 text-sm text-slate-700">
                        <label class="flex items-start gap-2"><input type="radio" name="mainProblem" value="Lentitud" required> <span>Lentitud: Tarda mucho en cargar.</span></label>
                        <label class="flex items-start gap-2"><input type="radio" name="mainProblem" value="Intermitencia"> <span>Intermitencia: Va y viene.</span></label>
                        <label class="flex items-start gap-2"><input type="radio" name="mainProblem" value="Corte total"> <span>Corte total: Sin acceso absoluto.</span></label>
                        <label class="flex items-start gap-2"><input type="radio" name="mainProblem" value="Problema con página específica"> <span>Problema específico: Una página no abre.</span></label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-2">¿A quién más le pasa?</label>
                    <div class="space-y-2 text-sm text-slate-700">
                        <label class="flex items-center gap-2"><input type="radio" name="scope" value="Solo a mí" required> <span>Solo a mí.</span></label>
                        <label class="flex items-center gap-2"><input type="radio" name="scope" value="A varios en la misma aula"> <span>A varios en la misma aula.</span></label>
                        <label class="flex items-center gap-2"><input type="radio" name="scope" value="A todo el grupo completo"> <span>A todo el grupo completo.</span></label>
                    </div>
                </div>
            </div>

            <!-- 4. DETALLES EXTRA -->
            <div class="border-b border-slate-200 pb-5 space-y-4">
                <h2 class="text-base font-semibold text-slate-700 mb-1">📝 4. Detalles de la falla</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase">¿Qué página intentas usar?</label>
                    <input type="text" id="targetPlatform" placeholder="Ej: Google Classroom" required class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase">Mensaje de error en pantalla</label>
                    <input type="text" id="errorMessage" placeholder="Ej: 'Error de DNS'" class="mt-1 block w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Evidencia (Opcional)</label>
                    <input type="file" id="screenshotFile" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>

            <!-- BOTÓN DIRECTO CORREGIDO -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 px-4 rounded-xl text-center text-lg block hover:bg-blue-700 transition-colors">
                    Enviar Reporte de Falla
                </button>
            </div>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://docs.google.com/spreadsheets/d/1rT5DSWTnbzfW6DOPpbUaHaLOk3PXLl1ZCSHJn0rhdW4/edit?gid=0#gid=0";

        const convertToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(','));
            reader.onerror = (error) => reject(error);
        });

        document.getElementById('failureReportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Enviando...";

            const currentTimestamp = new Date();
            const payload = {
                fecha: currentTimestamp.toLocaleDateString('es-MX'),
                hora: currentTimestamp.toLocaleTimeString('es-MX'),
                nombre: document.getElementById('userName').value,
                rol: document.getElementById('userRole').value,
                edificio: document.getElementById('schoolBuilding').value,
                dispositivo: document.getElementById('deviceType').value,
                marca: document.getElementById('deviceBrand').value,
                modelo: document.getElementById('deviceModel').value,
                sistemaOperativo: document.getElementById('deviceOS').value,
                problemaPrincipal: document.querySelector('input[name="mainProblem"]:checked').value,
                aQuienesAfecta: document.querySelector('input[name="scope"]:checked').value,
                plataformaAfectada: document.getElementById('targetPlatform').value,
